metadata-files:
  - _nav-posts.yml

project:
  type: website
  pre-render: scripts/prepare-authors.ts
  post-render:
    - scripts/remove-hidden-posts.ts
    - scripts/prepare-citations.ts
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
    - "!_docs/"

website:
  draft-mode: gone
  site-url: https://ggmblog.org
  title: "Grammars Gone Mental"
  open-graph: true
  navbar:
    pinned: true
    right:
      - icon: github
        href: https://github.com/mattwagers/roundup-sandbox
  search:
    location: navbar
    type: overlay
  page-footer:
    left: "© 2026 the authors. Posts are licensed under [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/). Grammars Gone Mental."
    right:
      - icon: github
        href: https://github.com/mattwagers/roundup-sandbox
        aria-label: GitHub

format:
  html:
    canonical-url: true
    theme:
      light: [litera, assets/light.scss]
      dark: [litera, assets/dark.scss]
    css: assets/custom.css
    grid:
      body-width: 860px
    toc: true
    code-fold: true
    code-tools: false

execute:
  freeze: auto

filters:
  - at: pre-ast
    path: filters/author-byline.lua
