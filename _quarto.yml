project:
  type: website
  pre-render: scripts/prepare-authors.ts
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
    - "!_docs/"

website:
  site-url: https://majestic-palmier-4ce0f2.netlify.app
  title: "Grammars Gone Mental"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - href: contributors.qmd
        text: Contributors
      - href: search.qmd
        text: Search
    right:
      - icon: github
        href: https://github.com/your-org/blog
  search: true
  page-footer:
    left: "© 2026 The Consortium"
    right:
      - icon: github
        href: https://github.com/placeholder/consortium-blog
        aria-label: GitHub

format:
  html:
    theme:
      light: [litera, assets/light.scss]
      dark: [litera, assets/dark.scss]
    css: assets/custom.css
    grid:
      body-width: 860px
    toc: true
    code-fold: true
    code-tools: false

execute:
  freeze: auto

filters:
  - at: pre-ast
    path: filters/author-byline.lua
