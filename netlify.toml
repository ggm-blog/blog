[build]
  command = "bash build.sh"
  publish = "_site"

[build.environment]
  QUARTO_VERSION = "1.9.37"

[[redirects]]
  from  = "/"
  to    = "/index.html"
  status = 200

[context.deploy-preview.environment]
  QUARTO_PROFILE = "staging"

[context.branch-deploy.environment]
  QUARTO_PROFILE = "staging"
